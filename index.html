<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HU 스킬 베이스드 러닝 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --red:#FA2E43; --red-tint:rgba(250,46,67,.08); --wash:rgba(250,46,67,.045); --ink:#171719; --t60:rgba(23,23,25,.6); --t45:rgba(23,23,25,.4);
  --line:#E6E7EA; --page:#F7F7F8; --white:#fff; --muted:#E6E7EA; --faint:#F2F2F4; --black:#0C0C0E;
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#fff;letter-spacing:-0.02em;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;letter-spacing:inherit}
input,textarea{font-family:inherit;letter-spacing:inherit}
.app{display:flex;height:100vh}
.proto{width:232px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px 10px 24px}
.proto h1{font-size:14px;font-weight:700;padding:0 10px 2px}
.proto p.sub{font-size:12px;color:var(--t60);padding:0 10px 12px}
.proto .grp{margin-top:12px}
.proto .grp>div{font-size:11px;font-weight:600;color:var(--t45);padding:6px 10px;letter-spacing:0}
.proto .item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:#33343a}
.proto .item:hover{background:var(--faint)}
.proto .item.on{background:var(--red-tint);color:var(--red);font-weight:700}
.stage{flex:1;min-width:0;overflow:auto;position:relative;background:#fff}
.shell{display:flex;min-height:100%;background:#fff}
.lnb{width:64px;flex:none;background:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;position:sticky;top:0;height:100vh}
.lnb .logo{width:26px;height:26px;margin-bottom:14px}
.lnb button{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6f7076}
.lnb button.on{background:var(--faint);color:var(--ink)}
.lnb .sep{width:34px;height:1px;background:var(--line);margin:6px 0}
.main{flex:1;min-width:1100px}
.gnb{height:60px;display:flex;align-items:center;gap:20px;padding:0 32px;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--line)}
.gnb .brand{font-size:20px;font-weight:800;color:var(--red);letter-spacing:-0.04em;white-space:nowrap}
.gnb .search{flex:1;max-width:460px;margin:0 auto;height:36px;border-radius:18px;background:var(--page);display:flex;align-items:center;padding:0 14px;color:var(--t60);font-size:13px;gap:8px;white-space:nowrap}
.gnb .links{display:flex;gap:16px;font-weight:600;font-size:13px;align-items:center;white-space:nowrap}
.gnb .login{background:#33343a;color:#fff;border-radius:18px;padding:7px 14px;font-size:12px;font-weight:600}
.goalbar{display:flex;align-items:center;gap:16px;padding:10px 32px;background:#fff;border-bottom:1px solid var(--line);position:relative}
.pf-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:100px;padding:4px 12px 4px 5px;font-weight:600;font-size:13px;white-space:nowrap}
.pf-pill.open{border:1.5px solid var(--ink)}
.goalbar .meta{min-width:200px;white-space:nowrap}
.goalbar .meta b{display:block;font-size:13px;font-weight:700}
.goalbar .meta span{font-size:11.5px;color:var(--t60)}
.bar{height:4px;border-radius:2px;background:var(--muted);overflow:hidden;width:240px}
.bar i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .5s}
.sp{flex:1}
.content{padding:14px 32px 64px;max-width:1220px;margin:0 auto}
.tile{width:40px;height:40px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.tile.s{width:32px;height:32px;border-radius:13px}
.tile svg{width:52%;height:52%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-weight:500;font-size:13px;padding:0 14px;height:36px;white-space:nowrap}
.btn.sm{height:32px;font-size:12.5px;padding:0 12px}
.btn.xs{height:28px;font-size:12px;padding:0 10px}
.btn.lg{height:44px;font-size:14px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(.94)}
.btn.outline{border:1px solid var(--line);background:#fff}
.btn.outline:hover{background:var(--page)}
.btn.dark{background:var(--ink);color:#fff}
.btn.subtle{background:var(--page)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:100px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:400;white-space:nowrap}
.chip.on{background:#46474C;color:#fff;border-color:#46474C}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:100px;background:rgba(0,0,0,.05);font-size:11.5px;font-weight:400;color:var(--ink);white-space:nowrap}
.tag.red{background:var(--red-tint);color:var(--red);font-weight:600}
.pt{display:inline-flex;align-items:center;gap:1px;height:20px;padding:0 8px 0 6px;border-radius:100px;background:var(--red-tint);color:var(--red);font-weight:700;font-size:12px;white-space:nowrap}
.pt small{font-size:10.5px;font-weight:500;margin-left:1px}
.pt.got::before{content:'✓';font-size:10px;margin-right:2px}
.pt.dim{background:rgba(0,0,0,.06);color:var(--t60)}
.pt.big{height:24px;font-size:14px;padding:0 10px}
.h28{font-size:22px;font-weight:700;letter-spacing:-0.035em;line-height:1.35}
.h24{font-size:18px;font-weight:700;letter-spacing:-0.035em;line-height:1.35}
.h20{font-size:16px;font-weight:700;letter-spacing:-0.03em;line-height:1.4}
.b16{font-size:14px;font-weight:700}
.s12{font-size:12px;color:var(--t60)}
.s14{font-size:13px;color:var(--t60)}
.red{color:var(--red)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.wash{background:var(--wash);border-radius:12px}
.thumb{border-radius:8px;aspect-ratio:16/9;width:100%;position:relative;overflow:hidden;background-size:cover;background-position:center}
.thumb .typ{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92)}
.thumb .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.55)}
.thumb .prog i{display:block;height:100%;background:var(--red)}
.railhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.railhead .sub{font-size:12px;color:var(--t60);margin-bottom:1px}
.railhead .ttl{font-size:17px;font-weight:700;letter-spacing:-0.035em}
.railhead .ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t60);font-weight:500}
.circ{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cc{cursor:pointer}
.cc .t{font-size:14px;font-weight:600;margin:8px 0 3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .m{font-size:12px;color:var(--t60);margin-bottom:6px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{padding:0 0 9px;font-size:16px;font-weight:700;color:var(--t45);position:relative;letter-spacing:-0.03em}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.tabs.sm button{font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:100;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{color:#FFB3BB;font-weight:700}
.pop{position:absolute;left:32px;top:52px;width:440px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.08)}
.pop .pr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer}
.pop .pr:hover,.pop .pr.cur{background:var(--page)}
.pop .tickc{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.pop .pr.cur .tickc{background:var(--red);border-color:var(--red);position:relative}
.pop .pr.cur .tickc::after{content:'';position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.module{border-radius:12px;background:var(--wash);padding:26px 30px;position:relative}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.avatar.s{width:36px;height:36px;font-size:12px}
.bubble{background:#fff;border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px}
.skpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.skp{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.skp.on{border:1.5px solid var(--red);padding:9.5px 13.5px}
.chk{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.chk.on{border:1.5px solid var(--red);padding:13.5px 15.5px}
.chk .box{width:20px;height:20px;border-radius:5px;border:2px solid #c4c5cb;flex:none;margin-top:1px;background:#fff;position:relative}
.chk.on .box{background:var(--ink);border-color:var(--ink)}
.chk.on .box::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.gauge{width:240px;height:128px;position:relative;margin:0 auto}
.gauge svg{width:100%;height:100%}
.step3{display:flex;gap:44px}
.stp{display:flex;gap:12px;align-items:center;transition:.4s}
.stp.next{opacity:.4}
.stp .ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--muted);flex:none}
.stp.done .ic{background:var(--red)}
.stp.now .ic{background:transparent;border:3px solid var(--muted);border-top-color:var(--red);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stepcard{flex:1;min-width:0}
.stepchip{display:inline-flex;height:22px;align-items:center;padding:0 10px;border-radius:100px;font-weight:700;font-size:12px;background:#fff;border:1px solid var(--line)}
.stepchip.on{background:#46474C;color:#fff;border-color:#46474C}
.reason{background:#fff;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;color:var(--t60)}
.galwrap{position:relative}
.galaxy{position:relative;border-radius:12px;background:var(--black);height:500px;overflow:hidden}
.galaxy svg.lines{position:absolute;inset:0;width:100%;height:100%}
.gnode{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;border-radius:100px;padding:6px 14px 6px 6px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:12px;cursor:pointer;transition:transform .2s;white-space:nowrap}
.gnode:hover{transform:translate(-50%,-50%) scale(1.05)}
.gnode small{display:block;font-size:10.5px;color:var(--t60);font-weight:500;line-height:1.3}
.gnode.grow{border:1.5px solid var(--red)}
.gnode.grow small{color:var(--red)}
.gnode.lock{background:var(--black);border:1px solid #4a4b52;color:#9a9ba2;opacity:.92}
.gnode.lock small{color:#7a7b82}
.gnode.sel{box-shadow:0 0 0 3px #fff}
.gnode.just{border:2.5px solid var(--red);animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,46,67,.7)}100%{box-shadow:0 0 0 22px rgba(250,46,67,0)}}
.gcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--red);border-radius:100px;padding:10px 20px;font-weight:700;gap:2px;z-index:2;cursor:pointer;font-size:13px}
.gcenter small{font-size:10.5px;color:var(--t60);font-weight:500}
.gring{position:absolute;left:50%;top:50%;border:1px dashed #4a4b52;border-radius:50%;transform:translate(-50%,-50%);opacity:.6;pointer-events:none}
.legend{position:absolute;left:16px;bottom:16px;background:var(--black);border:1px solid #3a3b42;border-radius:10px;padding:8px 12px;display:flex;gap:14px;font-size:11.5px;color:#fff;z-index:3}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sidepanel{position:absolute;right:16px;top:16px;width:340px;background:#fff;border-radius:10px;padding:14px;z-index:5;max-height:468px;overflow:auto}
.pbar{height:5px;border-radius:3px;background:var(--muted);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--red);transition:width .5s}
.pre{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.pre .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:#fff}
.pre.done .d{background:var(--red);border-color:var(--red)}
.pre.now .d{border-color:var(--red)}
.chat{max-width:1000px}
.me{align-self:flex-end;background:var(--ink);color:#fff;padding:10px 16px;border-radius:16px;font-weight:600;font-size:14px}
.ai{display:flex;gap:12px;align-items:flex-start}
.aib{background:var(--page);border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t45);margin-right:5px;animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.recs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:4px}
.rec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rec.top{border:1.5px solid var(--red);padding:15.5px}
.inp{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--red);border-radius:100px;padding:6px 14px 6px 18px}
.inp input{flex:1;border:0;outline:0;font-size:14px;background:transparent}
.inp.plain{border:1px solid var(--line)}
.inp .si{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.rmrow{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.rmrow.rec{border:1.5px solid var(--red);flex-direction:row;gap:0;padding:0}
.rmleft{width:400px;flex:none;padding:14px;display:flex;flex-direction:column;gap:10px}
.rmright{flex:1;min-width:0;background:var(--page);padding:16px}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
.tl{display:flex;flex-direction:column}
.tstep{display:flex;gap:16px}
.tstep .rail{display:flex;flex-direction:column;align-items:center}
.tstep .nd{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#fff;border:2px solid var(--line);color:var(--t60);flex:none}
.tstep.done .nd,.tstep.now .nd{background:var(--red);border-color:var(--red);color:#fff}
.tstep .ln{flex:1;width:2px;background:var(--muted);margin:2px 0}
.tstep.done .ln{background:var(--red)}
.tstep .bd{flex:1;padding-bottom:12px}
.tstep .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tstep.now .box{border:1.5px solid var(--red);padding:15.5px}
.pathwrap{display:flex;gap:40px}
.pathcol{flex:1;display:flex;flex-direction:column;align-items:center;max-width:640px}
.unit{width:100%;border-radius:14px;padding:14px 22px;background:var(--red);color:#fff;margin:12px 0}
.unit.lock{background:var(--muted);color:var(--ink)}
.pnode{width:68px;height:68px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;cursor:pointer;flex:none;transition:transform .15s}
.pnode:hover{transform:scale(1.05)}
.pnode.lock{background:var(--muted);color:#8b8c92;cursor:not-allowed}
.pnode.cur{width:84px;height:84px;border:5px solid #fff;box-shadow:0 0 0 3px var(--red)}
.prow{display:flex;align-items:center;gap:16px;height:96px;width:100%;justify-content:center}
.prow .lab{width:230px}
.prow .lab b{display:block;font-size:14px}
.bub{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:12px;color:var(--red);white-space:nowrap}
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:16px}
.cdgrid{display:flex;gap:32px;align-items:flex-start}
.cdleft{flex:1;min-width:0}
.cdright{width:420px;flex:none;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.lec{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lec .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;background:#fff}
.lec.done .c,.lec.now .c{background:var(--red);border-color:var(--red)}
.ms{display:flex;align-items:center;gap:10px;background:var(--wash);border-radius:8px;padding:8px 14px;font-size:12px}
.strip{display:flex;align-items:center;gap:16px;padding:12px 20px;border-radius:10px;background:var(--wash);margin-bottom:18px}
.mini{display:flex;align-items:center}
.mini i{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line);display:block;flex:none}
.mini i.d{background:var(--red);border-color:var(--red)}
.mini i.n{width:28px;height:28px;background:var(--red);border-color:var(--red)}
.mini u{width:36px;height:2px;background:var(--muted);display:block}
.mini u.d{background:var(--red)}
.growbar{height:8px;border-radius:4px;background:var(--muted);position:relative;overflow:hidden}
.growbar .f2{position:absolute;inset:0 auto 0 0;background:rgba(250,46,67,.35)}
.growbar .f1{position:absolute;inset:0 auto 0 0;background:var(--red)}
.hide{display:none!important}
.footer{padding:32px;color:var(--t45);font-size:11.5px}

/* ===== tight pass ===== */
:root{--line:#E3E4E8}
body{letter-spacing:-0.025em;line-height:1.45}
.card,.rec,.rmrow,.tstep .box,.skp,.chk,.pop,.module,.wash,.strip,.galaxy,.sidepanel{border-radius:8px}
.tile{width:34px;height:34px;border-radius:13px}.tile.s{width:28px;height:28px;border-radius:11px}
.gnb{height:52px;padding:0 28px;gap:16px}.gnb .search{height:32px}
.goalbar{padding:8px 28px;gap:12px}
.content{padding:12px 28px 48px}
.grid5,.grid4{gap:12px}.recs{gap:10px}.cards4{gap:10px}
.railhead{margin-bottom:10px}.railhead .ttl{font-size:16px}
.cc .t{font-size:13px;margin:6px 0 2px;line-height:1.35}.cc .m{font-size:11.5px;margin-bottom:4px}
.thumb{border-radius:6px}
.btn{height:34px;font-size:12.5px;padding:0 12px;border-radius:6px}.btn.sm{height:30px;font-size:12px}.btn.xs{height:26px;font-size:11.5px;padding:0 9px}.btn.lg{height:42px;font-size:13.5px;border-radius:8px}
.btn.dark:hover{background:#000}
.chip{height:28px;font-size:12.5px;padding:0 11px}
.tag{height:18px;font-size:11px;padding:0 7px}.pt{height:18px;font-size:11.5px}
.h28{font-size:20px}.h24{font-size:17px}.h20{font-size:15px}.b16{font-size:13.5px}

/* onboarding wizard */

.hgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.zlab{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);margin-bottom:8px}

.sk-g{background:#EDEDF0;border-radius:10px}

.vid .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:24px}
.vid .tm{position:absolute;left:20px;right:20px;bottom:16px}
.brg{border:1px solid var(--line);border-radius:22px;padding:24px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.08)}

/* core features */
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes burst{0%{transform:scale(.4);opacity:.9}100%{transform:scale(4);opacity:0}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}8%{opacity:1}40%{transform:translate(-260px,150px);opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25);opacity:.3}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
.dl{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s ease forwards}
.bst{transform-box:fill-box;transform-origin:center;animation:burst .9s ease-out forwards}
.pls{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
.sht{animation:shoot 7s linear infinite}
.stt{position:absolute;pointer-events:none;background:rgba(255,255,255,.96);color:#171719;border-radius:12px;padding:8px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;z-index:5;white-space:nowrap}
.gr{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;gap:4px}
.gr i{width:14px;height:14px;border-radius:4px;background:#EDEDF0;cursor:pointer;display:block}
.gr i:hover{outline:2px solid var(--ink);outline-offset:1px}
.gr i.today{outline:2px solid var(--red);outline-offset:1px}
.gr i.sel{outline:2px solid var(--ink);outline-offset:1px}
.mlab{position:relative;height:16px;font-size:11px;color:var(--t45)}
.mlab span{position:absolute}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.kpi4 div{background:var(--page);border-radius:18px;padding:16px 20px}
.kpi4 b{display:block;font-size:26px;letter-spacing:-0.04em;margin-top:2px}
.cfov{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:60;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cfov .bx{background:#fff;border-radius:28px;padding:40px 48px;text-align:center;max-width:460px;animation:pop .35s ease;position:relative;z-index:2}
.cf{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall 2.6s ease-in forwards}
.cardw{display:grid;grid-template-columns:380px 1fr;gap:48px;margin-top:36px;align-items:start}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--faint);font-size:14px}
.sw{width:42px;height:24px;border-radius:12px;background:#D8D8DD;position:relative}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ink)}.sw.on::after{left:20px}

@keyframes mv{from{transform:translate(var(--dx),var(--dy))}to{transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes fogout{from{opacity:.95;transform:scale(1)}to{opacity:0;transform:scale(1.6)}}
@keyframes fogdrift{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.mv{animation:mv .6s cubic-bezier(.2,.8,.2,1)}
.fin{animation:fin .7s ease}
.fgo{transform-box:fill-box;transform-origin:center;animation:fogout 1s ease forwards;pointer-events:none}
.fgd{animation:fogdrift 6s ease-in-out infinite}
.mapw{background:#EEF0F3;border-radius:24px;position:relative;overflow:hidden}
.mapw svg{display:block;width:100%;height:auto}

function build(){
  const sel=st.sel.map(id=>K[id]);
  const w=Object.fromEntries(sel.map(s=>[s.id,Math.max(gap(s),5)]));
  const hash=(s)=>{let h=0;for(const c of s+st.shuf)h=(h*31+c.charCodeAt(0))%97;return h/97};
  const cand=POOL.filter(c=>!c.done).map(c=>{const g=Object.entries(c.r).filter(([k,v])=>w[k]&&v>=.8).map(([k,v])=>[k,Math.round(v*10)]);const val=g.reduce((a,[k,p])=>a+p*w[k],0);return {...c,g,den:val/c.m*(1+hash(c.id)*(st.shuf?.5:0))}}).filter(c=>c.g.length).sort((a,b)=>b.den-a.den);
  let left=st.min,pick=[];
  for(const c of cand){if(c.m<=left){pick.push(c);left-=c.m}}
  pick.sort((a,b)=>a.lv-b.lv);
  const gain={};pick.forEach(c=>c.g.forEach(([k,p])=>gain[k]=(gain[k]||0)+p));
  return {pick,left,gain,sel,skipped:POOL.filter(c=>c.done&&Object.keys(c.r).some(k=>w[k]))}
}

    SK.forEach(x=>{const [px,py]=pos[x.id];const v=vis(x);const own=x.s==='own'&&v;const r=own?6+Math.min(ptAt(x),70)/70*11:6;const fogv=x.s==='new'||!v;g+=`<g style="cursor:pointer" onclick="st.sel=['${x.id}'];st.shuf=0;go(0)">${own?`<circle cx="${px}" cy="${py}" r="${r+8}" fill="#fff" opacity=".09"/>`:''}<circle cx="${px}" cy="${py}" r="${r}" fill="${own?'#fff':'none'}" stroke="#fff" stroke-opacity="${fogv?.25:own?1:.55}" ${own?'':'stroke-dasharray="3 3"'}/><text x="${px}" y="${py+r+17}" text-anchor="middle" font-size="12" font-weight="600" opacity="${fogv?.3:own?1:.6}">${fogv?'···':x.kr}</text></g>`});

  const nextId=[...CAR[sel].sk].sort((a,b)=>gap(K[b])-gap(K[a]))[0];
  const stn=K[st.stn&&CAR[sel].sk.includes(st.stn)?st.stn:nextId];
  let g='';
  CAR.forEach((c,ci)=>{const on=sel===ci;const idx=c.sk.map(id=>ORD.indexOf(id)).sort((a,b)=>a-b);
   g+=`<text x="14" y="${ys[ci]-18}" font-size="13" font-weight="700" fill="${cols[ci]}" opacity="${on?1:.4}">${c.nm}</text>`;
   for(let k=0;k<idx.length-1;k++){const a=K[ORD[idx[k]]],b=K[ORD[idx[k+1]]];const done=a.pt!=null&&b.pt!=null;g+=`<line x1="${X(idx[k])}" y1="${ys[ci]}" x2="${X(idx[k+1])}" y2="${ys[ci]}" stroke="${cols[ci]}" stroke-width="${on?(done?10:5):4}" stroke-opacity="${on?(done?1:.4):.25}" stroke-linecap="round" ${done||!on?'':'stroke-dasharray="2 10"'}/>`}
   if(on){const lastOwn=[...idx].reverse().find(i=>K[ORD[i]].pt!=null&&K[ORD[i]].pt>0);if(lastOwn!=null)g+=`<g transform="translate(${X(lastOwn)-17} ${ys[ci]-34})"><rect width="34" height="20" rx="8" fill="#171719"/><text x="17" y="14" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">나</text><path d="M12 20l5 6 5-6z" fill="#171719"/></g>`}});
  ORD.forEach((id,i)=>{const hit=CAR.map((c,ci)=>[c,ci]).filter(([c])=>c.sk.includes(id));if(hit.length>1)g+=`<line x1="${X(i)}" y1="${ys[hit[0][1]]}" x2="${X(i)}" y2="${ys[hit[hit.length-1][1]]}" stroke="#9C9DA3" stroke-width="3"/>`});
  ORD.forEach((id,i)=>{const s=K[id];const hit=CAR.map((c,ci)=>[c,ci]).filter(([c])=>c.sk.includes(id));hit.forEach(([c,ci])=>{const on=sel===ci;const own=s.pt!=null;g+=`<g style="cursor:pointer" onclick="st.car10=${ci};st.stn='${id}';render()" onmousemove="stt(event,'${id}')" onmouseleave="stOff()"><circle cx="${X(i)}" cy="${ys[ci]}" r="${hit.length>1?12:9}" fill="${own?cols[ci]:'#fff'}" stroke="${cols[ci]}" stroke-width="3.5" opacity="${on?1:.45}"/>${on&&id===nextId?`<circle class="pls" cx="${X(i)}" cy="${ys[ci]}" r="19" fill="none" stroke="#FA2E43" stroke-width="2.5"/>`:''}${on&&stn.id===id?`<circle cx="${X(i)}" cy="${ys[ci]}" r="21" fill="none" stroke="#171719" stroke-width="1.5" stroke-dasharray="3 3"/>`:''}</g>`});
   if(hit.length){g+=`<text x="${X(i)}" y="${ys[hit[hit.length-1][1]]+(hit.length>1?38:(i%2?-26:34))}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#33343a">${s.kr}</text>`}});
  const c=CAR[sel];const have=c.sk.filter(id=>K[id].pt!=null).length;
  return `<div class="wrap"><div class="chead"><span class="k">SKILL LINE MAP · 스킬 노선도</span><h1>직무는 <em>노선</em>, 스킬은 정거장</h1><p>내가 지나온 구간은 굵게, 앞으로 갈 구간은 점선이에요. 역을 누르면 자세히 보여요.</p></div>
  <div class="ct" style="justify-content:center">${CAR.map((x,i)=>`<button class="ctb ${sel===i?'on':''}" onclick="st.car10=${i};st.stn=null;render()">${x.nm}<small>${x.sk.filter(id=>K[id].pt!=null).length}/${x.sk.length}</small></button>`).join('')}</div>
  <div class="ginfo" style="grid-template-columns:1fr 340px"><div class="panel" style="padding:12px 8px;position:relative"><svg viewBox="0 0 1180 420" style="width:100%;height:auto">${g}</svg><div id="stt" class="stt"></div></div>
  <div class="panel"><div class="meta">${stn.id===nextId?'다음 정차역':'선택한 역'}</div><div style="display:flex;gap:14px;align-items:center;margin:10px 0 16px">${tile(stn.i,'l')}<div><b style="font-size:20px">${stn.kr}</b><div class="meta">${CAR.filter(x=>x.sk.includes(stn.id)).length>1?'환승역 · '+CAR.filter(x=>x.sk.includes(stn.id)).map(x=>x.nm).join(' · '):c.nm+' 노선'}</div></div></div><div class="meta">내 ${stn.pt??'—'}pt · 평균 ${stn.avg}pt</div><div class="bar" style="margin-top:8px"><i style="width:${stn.pt?Math.min(stn.pt/Math.max(stn.avg,stn.pt)*100,100):0}%"></i></div><button class="btn p" style="width:100%;justify-content:center;margin-top:20px" onclick="st.sel=['${stn.id}'];st.shuf=0;go(0)">${stn.kr}역으로 출발</button><div class="sub" style="margin-top:12px">${c.nm} 노선 ${have}/${c.sk.length}개 역 정차 · 환승역을 먼저 가면 여러 노선이 함께 가까워져요</div></div></div>${srcBlock('s10')}</div>`}


/* ===== ⑪ 대륙과 안개 (고도화) ===== */
function zonePos(){const pos={};Object.keys(ZC).forEach(z=>{const l=SK.filter(x=>x.z===z);l.forEach((x,i)=>{const a=i/l.length*Math.PI*2-.6;pos[x.id]=[ZC[z][0]+Math.cos(a)*(78+(i%2)*12)*1.3,ZC[z][1]+Math.sin(a)*(58+(i%2)*10)]})});return pos}
function blob(cx,cy,rx,ry,seed){const pts=Array.from({length:9},(_,i)=>{const a=i/9*Math.PI*2;const j=.82+((Math.sin(seed*13+i*2.3)+1)/2)*.36;return [cx+Math.cos(a)*rx*j,cy+Math.sin(a)*ry*j]});return smooth(pts)}
function view11n(){
  st.rev=st.rev||{};const pos=zonePos();const vis=x=>x.s!=='new'||st.rev[x.id];
  const zones=Object.keys(ZC);const exp=SK.filter(vis).length;
  const nextF=SK.filter(x=>!vis(x)).sort((a,b)=>SK.filter(z=>vis(z)&&z.n.includes(b.id)).length-SK.filter(z=>vis(z)&&z.n.includes(a.id)).length)[0];
  const cur=K[st.cty&&vis(K[st.cty])?st.cty:'plan'];const newly=st.fogNew;st.fogNew=null;
  let g=`<defs><filter id="fb"><feGaussianBlur stdDeviation="9"/></filter></defs>`;
  g+=Array.from({length:14},(_,i)=>`<path d="M${40+i*66} ${30+(i*53)%420} q18 -8 36 0 t36 0" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>`).join('');
  zones.forEach((z,i)=>{const l=SK.filter(x=>x.z===z);const v=l.filter(vis).length;g+=`<path d="${blob(ZC[z][0],ZC[z][1],205,135,i+1)}" fill="#fff" stroke="#D9DADF" stroke-width="2"/><text x="${ZC[z][0]}" y="${ZC[z][1]-96}" text-anchor="middle" font-size="13" font-weight="800" fill="#171719">${z}</text><text x="${ZC[z][0]}" y="${ZC[z][1]-80}" text-anchor="middle" font-size="11" fill="#6a6b73">탐험 ${Math.round(v/l.length*100)}%</text>`});
  SK.forEach(x=>x.n.forEach(n=>{if(x.id<n){const both=vis(x)&&vis(K[n]);g+=`<line x1="${pos[x.id][0]}" y1="${pos[x.id][1]}" x2="${pos[n][0]}" y2="${pos[n][1]}" stroke="${both?'#8E8F96':'#C8C9CE'}" stroke-width="${both?2:1.4}" ${both?'':'stroke-dasharray="3 6"'}/>`}}));
  SK.forEach(x=>{const [px,py]=pos[x.id];const v=vis(x);const own=x.s==='own';const r=own?8+Math.min(x.pt,70)/70*9:7;
   g+=`<g style="cursor:pointer" onmousemove="${v?`stt(event,'${x.id}')`:''}" onmouseleave="stOff()" onclick="${v?`st.cty='${x.id}';render()`:`st.rev['${x.id}']=1;st.fogNew='${x.id}';st.cty='${x.id}';render()`}">`;
   if(own)g+=`<circle cx="${px}" cy="${py}" r="${r+7}" fill="none" stroke="#171719" stroke-opacity=".18"/><circle cx="${px}" cy="${py}" r="${r+14}" fill="none" stroke="#171719" stroke-opacity=".1"/>`;
   g+=`<circle cx="${px}" cy="${py}" r="${r}" fill="${own?'#171719':v?'#fff':'#C8C9CE'}" stroke="#171719" stroke-width="2" ${x.s==='saved'?'stroke-dasharray="3 3"':''}/>`;
   if(x.id==='plan')g+=`<g transform="translate(${px-11} ${py-r-30})"><rect width="22" height="22" rx="8" fill="#FA2E43"/><text x="11" y="15" font-size="11" fill="#fff" text-anchor="middle" font-weight="800">나</text></g>`;
   if(nextF&&nextF.id===x.id&&!v)g+=`<circle class="pls" cx="${px}" cy="${py}" r="${r+12}" fill="none" stroke="#FA2E43" stroke-width="2.5"/>`;
   g+=`<text x="${px}" y="${py+r+17}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#171719">${v?x.kr:'안개 속'}</text>`;
   if(!v)g+=`<g class="fgd"><circle cx="${px}" cy="${py}" r="46" fill="#D5D6DB" opacity=".96" filter="url(#fb)"/><circle cx="${px-26}" cy="${py+10}" r="30" fill="#E0E1E5" opacity=".96" filter="url(#fb)"/><circle cx="${px+24}" cy="${py-8}" r="32" fill="#E0E1E5" opacity=".96" filter="url(#fb)"/></g>`;
   if(newly===x.id)g+=`<g class="fgo"><circle cx="${px}" cy="${py}" r="46" fill="#D5D6DB" filter="url(#fb)"/></g>`;
   g+='</g>'});
  return `<div class="wrap"><div class="chead"><span class="k">FOG OF WAR · 대륙과 안개</span><h1>지도를 <em>직접 열며</em> 탐험해요</h1><p>스킬 영역(대륙)마다 탐험률이 있어요. 안개 속 스킬을 누르면 안개가 걷히고 담기 처리돼요.</p></div>
  <div class="ginfo" style="grid-template-columns:1fr 340px"><div class="mapw"><svg viewBox="0 0 920 470">${g}</svg><div id="stt" class="stt" style="background:#171719;color:#fff"></div><div style="position:absolute;left:24px;bottom:16px" class="legend"><span><i style="background:#171719"></i>획득</span><span><i style="background:#fff;border:2px dashed #171719;width:6px;height:6px"></i>담아둠</span><span><i style="background:#C8C9CE"></i>안개 속</span></div></div>
  <div><div class="panel"><div class="meta">전체 탐험률</div><div style="font-size:34px;font-weight:800;letter-spacing:-0.04em">${exp}<span style="font-size:16px;color:var(--t45)"> / ${SK.length}</span></div><div class="bar" style="margin:10px 0 16px"><i class="g" style="width:${exp/SK.length*100}%"></i></div>${zones.map(z=>{const l=SK.filter(x=>x.z===z);const v=l.filter(vis).length;return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0"><span>${z}</span><b>${v}/${l.length}</b></div>`}).join('')}</div>
  <div class="panel" style="margin-top:14px"><div style="display:flex;gap:12px;align-items:center">${tile(cur.i,'l')}<div><b style="font-size:18px">${cur.kr}</b><div class="meta">${cur.s==='own'?cur.pt+'pt · 평균 '+cur.avg+'pt':cur.s==='saved'?'담아둠 · 평균 '+cur.avg+'pt':'새로 열었어요'}</div></div></div><button class="btn p s" style="margin-top:16px" onclick="st.sel=['${cur.id}'];st.shuf=0;go(0)">${cur.kr} 세션 만들기</button>${nextF?`<div class="sub" style="margin-top:14px">다음 탐험 추천: <b style="color:var(--ink)">${nextF.kr}</b>${nextF.n.length?` · ${K[nextF.n[0]].kr}와 이어져 있어요`:''}</div>`:'<div class="sub" style="margin-top:14px">지도를 모두 열었어요</div>'}</div></div></div>${srcBlock('s11')}</div>`}

/* ===== ⑫ 궤도 탐색 (고도화) ===== */
function bfs(a,b){const q=[[a]];const seen={[a]:1};while(q.length){const p=q.shift();const l=p[p.length-1];if(l===b)return p;for(const n of K[l].n)if(!seen[n]){seen[n]=1;q.push(p.concat(n))}}return null}
function view12n(){
  const cid=st.orb||'plan';const c=K[cid];const tgt=st.tg&&st.tg!==cid?st.tg:null;
  const path=tgt?bfs(cid,tgt):null;const onP=id=>path&&path.includes(id);
  const r1=c.n.map(id=>K[id]);const r2=[...new Set(r1.flatMap(x=>x.n))].filter(id=>id!==cid&&!c.n.includes(id)).map(id=>K[id]);
  const pos={};pos[cid]=[460,255];
  const place=(arr,R,off)=>arr.forEach((x,i)=>{const a=i/arr.length*Math.PI*2-Math.PI/2+off;pos[x.id]=[460+Math.cos(a)*R*1.4,255+Math.sin(a)*R]});
  place(r1,105,0);place(r2,205,.3);
  const prev=st.opos||{};
  let g=`<defs><radialGradient id="ob"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><ellipse cx="460" cy="255" rx="330" ry="235" fill="url(#ob)"/>`;
  g+=`<ellipse cx="460" cy="255" rx="${105*1.4}" ry="105" fill="none" stroke="#fff" stroke-opacity=".18" stroke-dasharray="3 6"/><ellipse cx="460" cy="255" rx="${205*1.4}" ry="205" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="3 6"/><text x="${460+105*1.4+6}" y="252" font-size="10.5" fill="#fff" opacity=".4">한 걸음</text><text x="${460+205*1.4+6}" y="252" font-size="10.5" fill="#fff" opacity=".4">두 걸음</text>`;
  const edges=[];r1.forEach(x=>edges.push([cid,x.id]));r2.forEach(x=>{const j=r1.find(a=>a.n.includes(x.id));if(j)edges.push([j.id,x.id])});
  edges.forEach(([a,b])=>{const hot=path&&path.includes(a)&&path.includes(b)&&Math.abs(path.indexOf(a)-path.indexOf(b))===1;g+=`<line class="fin" x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" stroke="${hot?'#FA2E43':'#fff'}" stroke-opacity="${hot?1:.28}" stroke-width="${hot?3:1.2}"/>`});
  const all=[c,...r1,...r2];
  all.forEach(x=>{const [px,py]=pos[x.id];const main=x.id===cid;const own=x.pt!=null;const r=main?24:r1.includes(x)?12:8;const o=prev[x.id];const dx=o?o[0]-px:0,dy=o?o[1]-py:0;
   g+=`<g class="${o?'mv':'fin'}" style="--dx:${dx}px;--dy:${dy}px;cursor:pointer" onmousemove="stt(event,'${x.id}')" onmouseleave="stOff()" onclick="${main?'':`st.trail=(st.trail||[]).concat('${cid}').slice(-5);st.orb='${x.id}';render()`}">`;
   if(main||own)g+=`<circle cx="${px}" cy="${py}" r="${r+12}" fill="#fff" opacity=".1"/>`;
   if(tgt===x.id)g+=`<circle class="pls" cx="${px}" cy="${py}" r="${r+11}" fill="none" stroke="#FA2E43" stroke-width="2.4"/>`;
   g+=`<circle cx="${px}" cy="${py}" r="${r}" fill="${main||own?'#fff':'#121214'}" stroke="#fff" stroke-opacity="${main||own?1:.55}" ${main||own?'':'stroke-dasharray="3 3"'}/><text x="${px}" y="${py+r+(main?24:17)}" text-anchor="middle" font-size="${main?17:12.5}" font-weight="${main?800:600}" opacity="${main||own||onP(x.id)?1:.6}">${x.kr}</text></g>`});
  st.opos=pos;
  const reach=SK.filter(x=>x.id!==cid&&bfs(cid,x.id)).length;
  const crumbs=((st.trail||[]).concat(cid));
  return `<div class="wrap"><div class="chead"><span class="k">RECENTER ORBIT · 궤도 탐색</span><h1>눌러서 <em>내 중심</em>으로 옮겨요</h1><p>스킬 하나를 가운데 두고 이웃을 펼쳐요. 다른 별을 누르면 부드럽게 옮겨가고, 목표 스킬까지 몇 걸음인지도 알려 줘요.</p></div>
  <div class="ginfo" style="grid-template-columns:1fr 360px"><div><div class="sky" style="position:relative"><svg viewBox="0 0 920 510" style="display:block">${g}</svg><div id="stt" class="stt"></div>${path?`<div style="position:absolute;left:24px;top:20px;background:rgba(255,255,255,.96);color:#171719;border-radius:16px;padding:10px 16px;font-size:13px"><b>${K[tgt].kr}까지 ${path.length-1}걸음</b><div style="color:#6a6b73;margin-top:2px">${path.map(id=>K[id].kr).join(' → ')}</div></div>`:''}</div>
  <div class="sub" style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">이동 경로 ${crumbs.map((id,i)=>i<crumbs.length-1?`<button class="pill o" onclick="st.orb='${id}';st.trail=st.trail.slice(0,${i});render()">${K[id].kr}</button>›`:`<b style="color:var(--ink)">${K[id].kr}</b>`).join(' ')}</div></div>
  <div><div class="panel"><div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${tile(c.i,'l')}<div><b style="font-size:20px">${c.kr}</b><div class="meta">${c.en}</div></div></div><div class="meta">내 ${c.pt??'학습 전'}${c.pt!=null?'pt':''} · 평균 ${c.avg}pt</div><div class="bar" style="margin-top:8px"><i style="width:${c.pt?Math.min(c.pt/Math.max(c.avg,c.pt)*100,100):0}%"></i></div><div class="sub" style="margin-top:10px">한 걸음 ${r1.length}개 · 두 걸음 ${r2.length}개 · 닿을 수 있는 스킬 ${reach}개</div><button class="btn p" style="width:100%;justify-content:center;margin-top:18px" onclick="st.sel=['${c.id}'];st.shuf=0;go(0)">${c.kr} 세션 만들기</button></div>
  <div class="panel" style="margin-top:14px"><b style="font-size:15px">가고 싶은 스킬</b><div class="nb">${SK.filter(x=>x.id!==cid).slice(0,10).map(x=>`<button style="${tgt===x.id?'background:var(--ink);color:#fff;border-color:var(--ink)':''}" onclick="st.tg='${tgt===x.id?'':x.id}';render()">${x.kr}</button>`).join('')}</div><div class="sub" style="margin-top:10px">고르면 지금 위치에서 가는 길이 빨갛게 표시돼요</div></div></div></div>${srcBlock('s12')}</div>`}
function render(){root.innerHTML=[view1,view2,view3,view4,view5,view6,view7,view8,view9n,view10n,view11n,view12n,view13,view14,view15,view16,view17,view18,view19,view20,view21,view22][st.tab]()}
if(window.SOLO!=null){document.querySelector('.top').style.display='none';st.tab=SOLO;render()}else go(19);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="aisrc"><!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HU 스킬 에이전트 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--red:#FA2E43;--ink:#171719;--acc:#6A6B73;--mut:#9A9BA3;--line:#E1E2E3;--page:#F7F7F8;--soft:#F2F4F7}
*{box-sizing:border-box;margin:0;padding:0}

.app{height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr);background:#fff}
.mn{display:flex;flex-direction:column;min-height:0;position:relative;min-width:0}

.lg0{display:flex;align-items:center;gap:10px;padding:0 6px;font-size:17px;font-weight:700;letter-spacing:-.03em}
.lg0 svg{width:26px;height:26px}
.newg{height:46px;border-radius:23px;background:var(--red);color:#fff;font-weight:700;font-size:14px}

.gl{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;width:100%;text-align:left}
.gl:hover{background:var(--page)}
.ring{width:32px;height:32px;position:relative;flex:none}
.ring svg{width:32px;height:32px;transform:rotate(-90deg)}

.hs{display:block;width:100%;text-align:left;font-size:13px;color:var(--acc);padding:9px 8px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs:hover{background:var(--page);color:var(--ink)}
.sbc{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:16px}
.sbc b{font-size:13.5px}
.sbc p{font-size:12.5px;color:var(--acc);line-height:1.55;margin:6px 0 12px}
.hd{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 40px;border-bottom:1px solid #F0F1F3}

<body>
<div class="app">
  <aside class="sb"><div class="lg0"><svg viewBox="0 0 28 28"><path d="M14 2l10.5 6v12L14 26 3.5 20V8z" fill="#FA2E43"/></svg>HU 스킬</div><button class="newg" id="newg">＋ 새 목표</button><div><div class="sbs">내 목표</div><div id="goals"></div></div><div><div class="sbs">어제</div><button class="hs">SQL 기초 세션 마침 · +50pt</button><button class="hs">보고서용 차트 고르는 법</button><div class="sbs" style="margin-top:10px">지난주</div><button class="hs">통계 용어 3분 복습</button></div><div class="sbc"><b>자율 학습 에이전트</b><p>목표만 두면 계획·세션·복습을 알아서 이어가요.</p><div class="bar" style="margin:0"><i style="width:62%"></i></div><p style="margin:8px 0 0">이번 주 4 / 5일 달성</p></div></aside>
  <section class="mn">
  <header class="hd"><button id="back" style="display:none">← 처음으로</button><span class="ttl">스킬 에이전트</span><span class="sp"></span><button>학습 기록</button></header>

  <aside class="pn" id="pn"></aside>
  <div class="toast" id="toast"></div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s);
const SK={
 sql:{n:'SQL',kw:['sql','쿼리','db','데이터베이스'],c:[['SQL 기초 · SELECT부터',12,20],['JOIN으로 테이블 합치기',15,30],['실무 쿼리 정리 입문',18,40]]},
 ana:{n:'데이터 분석',kw:['분석','인사이트'],c:[['분석 질문 세우는 법',10,20],['지표로 원인 찾기',14,30],['분석 결과 한 장 요약',12,30]]},
 sta:{n:'통계',kw:['통계','가설','확률'],c:[['평균과 분포 한눈에',10,20],['가설검정 쉽게 이해하기',16,30]]},
 viz:{n:'시각화',kw:['시각화','차트','대시보드','그래프'],c:[['차트 고르는 기준',8,20],['대시보드 구성 연습',15,30]]},
 kpi:{n:'KPI 설계',kw:['kpi','지표','성과'],c:[['좋은 KPI의 조건',10,20],['북극성 지표 정하기',14,30]]},
 ux:{n:'서비스 기획',kw:['기획','pm','서비스','ux'],c:[['문제 정의 한 장 쓰기',12,20],['사용자 여정 그리기',15,30],['요구사항 문서 구조',14,30]]},
 prm:{n:'프롬프트',kw:['프롬프트','ai','챗','생성'],c:[['프롬프트 기본 구조',8,20],['역할·맥락 주기',12,30]]},
 aut:{n:'업무 자동화',kw:['자동','반복','엑셀'],c:[['반복 업무 찾기',10,20],['AI로 문서 초안 만들기',14,30]]},
 mkt:{n:'마케팅 데이터',kw:['마케팅','광고','전환','퍼널'],c:[['퍼널로 보는 전환',12,20],['캠페인 성과 읽기',14,30]]}
};
const JOB={data:['sql','ana','viz','sta'],plan:['ux','kpi','ana','viz'],ai:['prm','aut','ana'],mkt:['mkt','viz','kpi','ana']};
const GOALS=[{t:'데이터 분석가 되기',p:34,s:'SQL · 분석 · 시각화',q:'데이터 분석가로 일하고 싶어요. 4주 안에 SQL부터 시작할래요'},{t:'서비스 기획 KPI',p:12,s:'KPI · 기획',q:'서비스 기획에서 KPI를 직접 설계하고 싶어요'},{t:'업무 자동화 AI',p:0,s:'프롬프트 · 자동화',q:'AI로 반복 업무를 줄이고 싶어요'}];
const S={mins:15,wk:false,auto:true,ver:0,plan:null};
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const MARK='<svg class="av" viewBox="0 0 28 28"><path d="M14 2l10.5 6v12L14 26 3.5 20V8z" fill="#FA2E43"/></svg>';
function detect(tx,first){
  const l=tx.toLowerCase();let hit=[];
  for(const k in SK)if(SK[k].kw.some(w=>l.includes(w)))hit.push(k);
  let job='data';
  if(/기획|pm|서비스/.test(l))job='plan';else if(/ai|프롬프트|자동|반복/.test(l))job='ai';else if(/마케|광고/.test(l))job='mkt';
  const out=[...hit];for(const k of JOB[job])if(out.length<4&&!out.includes(k))out.push(k);
  if(first&&first.length){const f=first.filter(k=>out.includes(k));return [...f,...out.filter(k=>!f.includes(k))]}
  return out.slice(0,4);
}
function build(skills,mins,wk){
  const items=[];skills.forEach(k=>SK[k].c.forEach(c=>items.push({k,t:c[0],m:c[1],p:c[2]})));
  const days=[];let i=0;const d0=new Date();
  while(i<items.length&&days.length<30){
    const d=new Date(d0);d.setDate(d0.getDate()+days.length);const dow=d.getDay();
    if(wk&&(dow===0||dow===6)){days.push({d,rest:true,items:[],min:0});continue}
    const it=[];let used=0;
    while(i<items.length&&(used===0||used+items[i].m<=mins)){it.push(items[i]);used+=items[i].m;i++}
    days.push({d,items:it,min:used});
  }
  return{skills,items,days,tm:items.reduce((a,b)=>a+b.m,0),tp:items.reduce((a,b)=>a+b.p,0)};
}
const fmt=d=>(d.getMonth()+1)+'/'+d.getDate();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* composer */
function composer(big){
  return `<div class="box"><textarea id="inp" placeholder="${big?'예) 3주 안에 SQL로 직접 데이터를 뽑을 수 있게 되고 싶어요':'조건을 바꾸거나 새 목표를 말해 보세요'}"></textarea><div class="row"><button class="opt" id="oMin"></button><button class="opt" id="oWk">주말 쉬기</button><button class="opt" id="oAuto">자율 모드</button><button class="send" id="send" disabled>${big?'시작하기':'보내기'}</button></div></div>`;
}
function bindComposer(){
  const inp=$('#inp'),send=$('#send');
  const chk=()=>send.disabled=!inp.value.trim();
  inp.oninput=chk;
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();const v=inp.value.trim();if(v)ask(v)}};
  send.onclick=()=>{const v=inp.value.trim();if(v)ask(v)};
  $('#oMin').onclick=()=>{const a=[10,15,20,30];S.mins=a[(a.indexOf(S.mins)+1)%a.length];syncOpts()};
  $('#oWk').onclick=()=>{S.wk=!S.wk;syncOpts()};
  $('#oAuto').onclick=()=>{S.auto=!S.auto;syncOpts()};
  syncOpts();
}
function syncOpts(){const m=$('#oMin');if(!m)return;m.textContent='하루 '+S.mins+'분';$('#oWk').classList.toggle('on',S.wk);$('#oAuto').classList.toggle('on',S.auto)}
/* home */
function drawGoals(){
  $('#goals').innerHTML=GOALS.map((g,i)=>{const c=2*Math.PI*12,o=c*(1-g.p/100);return`<button class="gl" data-g="${i}"><span class="ring"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#EDEEF1" stroke-width="3.5"/><circle cx="16" cy="16" r="12" fill="none" stroke="#FA2E43" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><b>${g.p}</b></span><span><strong>${g.t}</strong><em>${g.s}</em></span></button>`}).join('');
  document.querySelectorAll('.gl').forEach(b=>b.onclick=()=>ask(GOALS[b.dataset.g].q));
}
function home(){
  S.plan=null;S.ver=0;busy=false;
  $('#back').style.display='none';$('#cmp').classList.remove('on');$('#cmp').innerHTML='';drawGoals();
  $('#stage').innerHTML=`<div class="home">
   <svg class="mk" viewBox="0 0 28 28"><path d="M14 2l10.5 6v12L14 26 3.5 20V8z" fill="#FA2E43"/></svg>
   <h1>안녕하세요, 김휴넷님</h1>
   <p class="sub">목표만 말해주세요.<br>무엇을, 어떤 순서로, 얼마나 배울지는 제가 정하고 매일 이어갈게요.</p>
   <div class="cards">
    <div class="cd"><div class="k"><i></i>자율 학습<span>켜짐</span></div><p>하루 15분 · 다음 세션은 제가 준비해 둘게요. 오답이 나오면 복습도 알아서 끼워 넣어요.</p><div class="ft"><span>에이전트</span><b>모두 보기</b></div></div>
    <div class="cd"><div class="k">오늘 할 일</div><div style="margin-top:8px">${[['SQL JOIN 15분'],['어제 오답 3문제 복습'],['분석 질문 세우기 10분']].map(r=>`<div class="tk"><i></i>${r[0]}</div>`).join('')}</div><div class="ft"><span>3개 · 약 28분</span><b>전체 보기</b></div></div>
    <button class="cd" data-q="3주 안에 SQL로 직접 데이터를 뽑을 수 있게 되고 싶어요"><q>3주 안에 SQL로 직접 데이터를 뽑을 수 있게 되고 싶어요</q><div class="ft" style="width:100%"><span>이런 식으로 말해보세요</span><b>↗</b></div></button>
   </div>
   ${composer(true).replace('class="box"','class="box" style="margin-top:36px"')}

function addChat(h){const c=$('.chat');const d=document.createElement('div');d.innerHTML=h;const n=d.firstElementChild;c.appendChild(n);$('#stage').scrollTo({top:1e5,behavior:'smooth'});return n}
async function steps(list){
  const box=addChat(`<div class="a">${MARK}<div class="bd"><div class="st"></div></div></div>`);
  const st=box.querySelector('.st');
  for(const [t,s] of list){
    const r=document.createElement('div');r.className='sp1';r.innerHTML=`<span class="ic"></span>${t}<small></small>`;st.appendChild(r);
    $('#stage').scrollTo({top:1e5,behavior:'smooth'});await sleep(620);
    r.classList.add('ok');r.querySelector('.ic').textContent='✓';r.querySelector('small').textContent=s;
  }
}
async function ask(text){
  if(busy)return;busy=true;
  startChat();$('#inp').value='';$('#send').disabled=true;
  document.querySelectorAll('.plan').forEach(p=>p.classList.add('old'));
  addChat(`<div class="u">${esc(text)}</div>`);
  const first=S.plan&&S.plan.skills;const sk=detect(text,first);
  const mm=text.match(/(\d+)\s*분/);if(mm&&+mm[1]>=5&&+mm[1]<=60)S.mins=+mm[1];
  if(/주말/.test(text)&&/쉬|제외|빼/.test(text))S.wk=true;
  const fv=text.match(/(sql|통계|시각화|kpi|프롬프트)\s*(먼저|부터)/i);let ord=sk;
  if(fv){const k=Object.keys(SK).find(k=>SK[k].kw.includes(fv[1].toLowerCase()));if(k)ord=[k,...sk.filter(x=>x!==k)]}
  syncOpts();
  const plan=build(ord,S.mins,S.wk);S.plan=plan;S.ver++;
  await steps(S.ver===1?[['목표 읽는 중','핵심 키워드 추출'],['필요한 스킬 도출',ord.length+'개 스킬'],['내 보유 스킬과 비교','시작 지점 정함'],['콘텐츠 고르는 중','관련도 0.8 이상 '+plan.items.length+'개'],['하루 '+S.mins+'분으로 나누는 중','약 '+plan.days.length+'일']]:[['바뀐 조건 반영','하루 '+S.mins+'분'+(S.wk?' · 주말 쉬기':'')],['순서 다시 짜는 중','약 '+plan.days.length+'일']]);
  addChat(`<div class="a">${MARK}<div class="bd">
   <div class="tx">${S.ver===1?`<b>${ord.map(k=>SK[k].n).join(' · ')}</b> 순서로 약 <b>${plan.days.length}일</b> 계획을 세웠어요. 오늘은 <b>${plan.days[0].items[0]?plan.days[0].items[0].t:''}</b>부터 시작해요.`:`조건을 바꿔서 계획을 다시 세웠어요. 이전 계획은 흐리게 남겨 뒀어요.`}</div>
   ${planCard(plan)}${S.ver===1?autoCard():''}
   <div class="sug">${['하루 10분으로 줄여줘','주말은 쉬고 싶어','통계 먼저 배울래','더 어렵게 해줘'].map(t=>`<button class="sg">${t}</button>`).join('')}</div>
  </div></div>`);
  bindResult();busy=false;
}
function planCard(p){
  const by={};p.items.forEach(i=>{(by[i.k]=by[i.k]||{m:0,p:0,n:0});by[i.k].m+=i.m;by[i.k].p+=i.p;by[i.k].n++});
  return`<div class="plan"><div class="ph"><div><h3>${p.days.filter(d=>!d.rest).length}회 학습 계획</h3><p>총 ${p.tm}분 · 완료하면 +${p.tp}pt · 하루 ${S.mins}분 기준</p></div><span class="ver">v${S.ver}</span></div>
  ${p.skills.map(k=>`<div class="skr"><b>${SK[k].n}</b><div class="bar" style="margin:0"><i style="width:0" data-w="${Math.round(by[k].p/p.tp*100)}"></i></div><em>${by[k].n}개 · ${by[k].m}분 · +${by[k].p}pt</em></div>`).join('')}

  <div class="pf"><button class="btn r" data-act="start">오늘 세션 시작 · ${p.days[0].min}분</button><button class="btn o" data-act="edit">조건 바꾸기</button></div></div>`;
}
function autoCard(){
  return`<div class="auto"><div class="hd2"><div><b>자율 모드</b><p>켜 두면 아래 일을 제가 알아서 해요</p></div><button class="sw ${S.auto?'on':''}" id="sw"></button></div>
  <div class="log ${S.auto?'':'off'}" id="log">
   <div class="lg"><b>매일 저녁 8시</b> 다음 날 세션을 미리 만들어 둬요<time>내일 20:00 첫 알림</time></div>
   <div class="lg"><b>오답이 나오면</b> 3분짜리 복습을 다음 세션에 끼워 넣어요<time>세션이 끝날 때마다 확인</time></div>
   <div class="lg"><b>3일 쉬면</b> 분량을 줄여서 다시 시작하게 도와줘요<time>자동 조정</time></div>

  </div></div>`;
}
function bindResult(){
  const last=[...document.querySelectorAll('.plan')].pop();
  setTimeout(()=>last&&last.querySelectorAll('.bar i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%'),100);
  document.querySelectorAll('.sg:not([b])').forEach(b=>{b.setAttribute('b',1);b.onclick=()=>ask(b.textContent)});

  const sw=$('#sw');if(sw&&!sw.getAttribute('b')){sw.setAttribute('b',1);sw.onclick=()=>{S.auto=!S.auto;sw.classList.toggle('on',S.auto);$('#log').classList.toggle('off',!S.auto);syncOpts()}}

/* sheet */
function openSheet(){
  const d=S.plan.days[0];let done=0;const pn=$('#pn');
  pn.innerHTML=`<button class="cl" id="cl">×</button><h3>오늘의 세션</h3><div class="s2">${d.items.length}개 · ${d.min}분 · +${d.items.reduce((a,b)=>a+b.p,0)}pt · 하나씩 눌러서 마쳐요</div>
  ${d.items.map((x,i)=>`<button class="it"><span class="cb">✓</span><span><strong>${x.t}</strong><em>${SK[x.k].n} · ${x.m}분</em></span><u>+${x.p}pt</u></button>`).join('')}`;
  $('#sh').classList.add('on');pn.classList.add('on');

  pn.querySelectorAll('.it').forEach(b=>b.onclick=()=>{

      setTimeout(()=>{closeSheet();GOALS[0].p=Math.min(100,GOALS[0].p+Math.round(pt/S.plan.tp*100));drawGoals();
        const nx=S.plan.days.find((x,i)=>i>0&&!x.rest);
        addChat(`<div class="a">${MARK}<div class="bd"><div class="tx">오늘 세션 끝! <b>+${pt}pt</b> 쌓였어요. ${nx&&nx.items[0]?`내일은 <b>${nx.items[0].t}</b>${nx.items.length>1?' 외 '+(nx.items.length-1)+'개':''}로 <b>${nx.min}분</b>이에요. 저녁 8시에 준비해 둘게요.`:'계획을 모두 마쳤어요.'}</div></div></div>`);
        toast('+'+pt+'pt 획득');},500);
    }
  });
}
function closeSheet(){$('#sh').classList.remove('on');$('#pn').classList.remove('on')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
$('#back').onclick=()=>{if(!busy){closeSheet();home()}};$('#newg').onclick=()=>{if(!busy){closeSheet();home()}};

<script>
const $=s=>document.querySelector(s);

const SKILLS=[['plan','서비스 기획',3920,80,62],['data','데이터 분석',2960,68,34],['sql','SQL',2540,57,null],['kpi','지표 설계',1480,46,20],['res','사용자 리서치',2240,52,30],['req','요구사항 정의',2810,55,48],['pres','프레젠테이션',2120,49,28],['ab','A/B 테스트',610,33,null],['road','로드맵 설계',1130,41,null]];
const CONTS=[['c1','문제 정의, 30분이면 충분해요','영상',12,980,['plan','res']],['c2','인터뷰 질문, 이렇게 설계해요','영상',9,860,['res']],['c3','첫 SQL 쿼리 따라 써보기','영상',14,1240,['sql','data']],['c4','좋은 지표는 이렇게 정의해요','영상',11,740,['kpi','plan']],['c5','한 장 기획서 쓰는 법','과정',16,1590,['pres','plan']],['c6','퍼널 분석 입문','영상',18,1100,['data','sql']],['c7','요구사항을 빠짐없이 정리하기','영상',13,820,['req','plan']],['c8','발표 스토리라인 짜기','카드뉴스',10,1320,['pres']],['c9','A/B 테스트 설계 실습','과정',20,540,['ab','data','kpi']],['c10','로드맵, 우선순위부터 정하기','영상',12,610,['road','plan']],['c11','지표로 보는 서비스 건강검진','영상',9,980,['kpi','data']],['c12','페르소나 7분 완성','카드뉴스',7,1450,['res','plan']],['c13','데이터로 검증하는 서비스 기획','과정',200,3057,['plan','data']],['c14','SQL JOIN 한 번에 이해하기','영상',15,1180,['sql']]];

const ND={};

CONTS.forEach(r=>ND[r[0]]={id:r[0],d:'c',name:r[1],type:r[2],m:r[3],pop:r[4],sk:r[5]});
CAREERS.forEach(r=>ND[r[0]]={id:r[0],d:'k',name:r[1],h:r[2],sk:r[3],mine:r[4],pop:r[2]});
(function(){let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;const pick=a=>a[Math.floor(rnd()*a.length)];
['기획 문서','가설 설정','우선순위','스토리보드','와이어프레임','UX 라이팅','고객 인터뷰','시장 분석','경쟁사 분석','데이터 시각화','통계 기초','엑셀','프롬프트','업무 자동화','협업 도구','회의 진행','보고서 작성','협상','리더십','시간 관리','OKR','성과 관리','문제 해결'].forEach((nm,i)=>{ND['x'+i]={id:'x'+i,d:'s',name:nm,h:Math.round(300+rnd()*2700),avg:Math.round(25+rnd()*45),pt:null,pop:Math.round(300+rnd()*2700)}});

for(let i=0;i<90;i++){const sk=[];const n=1+Math.floor(rnd()*3);while(sk.length<n){const x=pick(sids);if(!sk.includes(x))sk.push(x)}const ty=pick(TY);ND['g'+i]={id:'g'+i,d:'c',name:ND[sk[0]].name+' '+pick(SUF),type:ty,m:ty==='과정'?Math.round(60+rnd()*180):ty==='카드뉴스'?Math.round(3+rnd()*5):Math.round(6+rnd()*20),pop:Math.round(150+rnd()*2400),sk}}
['데이터 사이언티스트','마케팅 매니저','프로젝트 매니저','HR 담당자','영업 관리자','UX 디자이너','사업 개발','교육 담당자'].forEach((nm,i)=>{const sk=[];const n=5+Math.floor(rnd()*4);while(sk.length<n){const x=pick(sids);if(!sk.includes(x))sk.push(x)}ND['kx'+i]={id:'kx'+i,d:'k',name:nm,h:Math.round(200+rnd()*900),sk,pop:Math.round(200+rnd()*900)}});
})();
const sh=(a,b)=>a.filter(x=>b.includes(x)).length;
const NBC={};
function nbrs(id){
  if(NBC[id])return NBC[id];
  const n=ND[id];const out={s:[],c:[],k:[]};
  Object.values(ND).filter(x=>x.id!==id).forEach(x=>{let w=0;const t=n.d+x.d;
    if(t==='ss')w=Object.values(ND).filter(c=>c.d==='c'&&c.sk.includes(n.id)&&c.sk.includes(x.id)).length;
    else if(t==='sc'||t==='sk')w=x.sk.includes(n.id)?1:0;
    else if(t==='cs'||t==='ks')w=n.sk.includes(x.id)?1:0;
    else if(t==='cc')w=sh(n.sk,x.sk);
    else if(t==='ck'||t==='kc')w=sh(n.sk,x.sk)?1:0;
    else if(t==='kk')w=sh(n.sk,x.sk)>=3?1:0;
    if(w>0)out[x.d].push([x,w])});
  for(const d in out)out[d]=out[d].sort((a,b)=>b[1]-a[1]||b[0].pop-a[0].pop).map(a=>a[0]);
  return NBC[id]=out;
}
const STARTS=[['마이커리어','k1'],['인기 스킬','plan'],['인기 콘텐츠','c13'],['인기 커리어','k3']];
/* ---------- 확장 트리 ---------- */
let FULL=false;let ZOOM=1,PX=0,PY=0;
const T={root:null,nodes:{},extra:[],sel:null,pos:{},tgt:{},last:null};
const PW=214,PH=40,GX=290,UH=50;
const CAPD={s:{s:3,c:4,k:2},c:{s:4,c:0,k:3},k:{s:5,c:0,k:2}};
const START={k1:{caps:{s:7,c:0,k:0},hint:'내 마이커리어에 필요한 스킬부터 보여줘요. 스킬을 누르면 그 스킬을 배울 콘텐츠가 이어져요.'},plan:{caps:{s:3,c:6,k:0},hint:'이 스킬을 배울 수 있는 콘텐츠와, 함께 쓰이는 스킬부터 보여줘요.'},c13:{caps:{s:4,c:0,k:3},hint:'이 콘텐츠가 다루는 스킬과, 도움이 되는 커리어부터 보여줘요.'},k3:{caps:{s:5,c:0,k:3},hint:'이 커리어에 필요한 스킬과, 비슷한 커리어부터 보여줘요.'}};
function pred(a,b){let x=a,y=b;if(x.d==='s'&&y.d!=='s'){[x,y]=[y,x]}else if(x.d==='k'&&y.d==='c'){[x,y]=[y,x]}
  let label='연관';if(y.d==='s'&&x.d==='c')label='다룸';else if(y.d==='s'&&x.d==='k')label='요구함';else if(x.d==='c'&&y.d==='k')label='추천';
  return{from:x,to:y,label,dir:!(x.d==='s'&&y.d==='s')}}
function reset(id){T.hint=START[id]?START[id].hint:'이 노드를 중심으로 이어진 항목부터 펼쳤어요.';Object.keys(els).forEach(k=>{els[k].remove();delete els[k]});T.root=id;T.nodes={};T.extra=[];T.sel=null;T.pos={};T.tgt={};T.nodes[id]={id,parent:null,depth:0,ex:false,kids:[]};expand(id,true);T.sel=id}
function avail(id){const nb=nbrs(id);const caps=(id===T.root&&START[id])?START[id].caps:CAPD[ND[id].d];return['s','c','k'].flatMap(d=>nb[d].filter(n=>!T.nodes[n.id]).slice(0,caps[d]))}
function more(id){const nb=nbrs(id);return['s','c','k'].reduce((a,d)=>a+nb[d].filter(n=>!T.nodes[n.id]).length,0)}
function expand(id,quiet){
  const n=T.nodes[id];if(!n||n.ex)return;
  if(n.depth>=5){toast('여기까지 펼쳤어요. 더블클릭으로 이 노드를 중심으로 삼아 보세요');return}
  const list=avail(id);
  if(!list.length){if(!quiet)toast('더 펼칠 노드가 없어요');return}
  list.forEach(c=>{T.nodes[c.id]={id:c.id,parent:id,depth:n.depth+1,ex:false,kids:[]};n.kids.push(c.id);T.pos[c.id]={x:null}});
  // 이미 화면에 있는 이웃과는 점선으로 연결
  const nb=nbrs(id);[...nb.s,...nb.c,...nb.k].forEach(m=>{if(T.nodes[m.id]&&m.id!==n.parent&&!n.kids.includes(m.id)&&!T.extra.some(e=>(e[0]===id&&e[1]===m.id)||(e[0]===m.id&&e[1]===id)))T.extra.push([id,m.id])});
  n.ex=true;
}
function collapse(id){
  const n=T.nodes[id];if(!n)return;
  const kill=k=>{const c=T.nodes[k];if(!c)return;c.kids.forEach(kill);delete T.nodes[k];delete T.pos[k];delete T.tgt[k];T.extra=T.extra.filter(e=>e[0]!==k&&e[1]!==k)};
  n.kids.forEach(kill);n.kids=[];n.ex=false;
}
function height(id){const n=T.nodes[id];return n.ex&&n.kids.length?n.kids.reduce((a,k)=>a+height(k),0):1}
function layout(){
  let y=0;
  const walk=(id)=>{const n=T.nodes[id];const h=height(id);
    if(n.ex&&n.kids.length){const start=y;n.kids.forEach(walk);const first=T.tgt[n.kids[0]].y,last=T.tgt[n.kids[n.kids.length-1]].y;T.tgt[id]={x:44+n.depth*GX,y:(first+last)/2}}
    else{T.tgt[id]={x:44+n.depth*GX,y:(typeof FULL!=='undefined'&&FULL?150:60)+y*UH};y+=1}
  };
  walk(T.root);
}
/* ---------- 렌더 ---------- */
const stage=$('#stage'),cvEl=$('#cv'),sv=$('#sv');
const els={};let ct=0;
function pathIds(){const ids=[];let c=T.sel;while(c){ids.unshift(c);c=T.nodes[c]&&T.nodes[c].parent}return ids}
function sync(){
  layout();
  Object.keys(T.nodes).forEach(id=>{
    if(!els[id]){const el=document.createElement('div');el.className='pl born';el.dataset.id=id;
      el.onclick=()=>{clearTimeout(ct);ct=setTimeout(()=>click(id),230)};el.ondblclick=e=>{e.preventDefault();clearTimeout(ct);reroot(id)};cvEl.appendChild(el);els[id]=el;
      const p=T.nodes[id].parent;const s=p&&T.pos[p]&&T.pos[p].x!=null?T.pos[p]:T.tgt[id];T.pos[id]={x:s.x,y:s.y};el.style.left=s.x+'px';el.style.top=(s.y-(id===T.root?24:PH/2))+'px';
      requestAnimationFrame(()=>el.classList.remove('born'))}
  });
  Object.keys(els).forEach(id=>{if(!T.nodes[id]){els[id].remove();delete els[id]}});
  const ids=new Set(pathIds());
  Object.keys(T.nodes).forEach(id=>{const n=ND[id],el=els[id],t=T.nodes[id];
    el.className='pl'+(id===T.root?' root':'')+(ids.has(id)?' path':'')+(t.ex?' ex':'');
    const cnt=t.ex?'−':'+'+Math.min(more(id),99);
    el.innerHTML=`<i class="d" style="background:${id===T.root||ids.has(id)?'#FA2E43':COL[n.d]}"></i><span class="t">${n.name}</span>${id===T.root?'':`<span class="pt">${t.ex?'−':(more(id)?'+'+more(id):'·')}</span>`}`;
  });
  tick();
  updateBar();updatePanel();updateTray();
}
let raf=0;
let fin=0;
function snapAll(){Object.keys(T.nodes).forEach(id=>{const p=T.pos[id],t=T.tgt[id];if(!t)return;p.x=t.x;p.y=t.y;const el=els[id];if(el){el.style.left=p.x+'px';el.style.top=(p.y-(id===T.root?24:PH/2))+'px'}});draw()}
function tick(){cancelAnimationFrame(raf);clearTimeout(fin);fin=setTimeout(snapAll,700);
  const step=()=>{let moving=false;
    Object.keys(T.nodes).forEach(id=>{const p=T.pos[id],t=T.tgt[id];if(!t)return;const dx=t.x-p.x,dy=t.y-p.y;if(Math.abs(dx)+Math.abs(dy)>.5){p.x+=dx*.22;p.y+=dy*.22;moving=true}else{p.x=t.x;p.y=t.y}
      const el=els[id];if(el){el.style.left=p.x+'px';el.style.top=(p.y-(id===T.root?24:PH/2))+'px'}});
    draw();if(moving)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step)}
function elbow(x1,y1,x2,y2){const xm=x1+(x2-x1)*.5,r=14;if(Math.abs(y2-y1)<2*r)return`M${x1},${y1} C${xm},${y1} ${xm},${y2} ${x2},${y2}`;const s=y2>y1?1:-1;return`M${x1},${y1} H${xm-r} Q${xm},${y1} ${xm},${y1+s*r} V${y2-s*r} Q${xm},${y2} ${xm+r},${y2} H${x2}`}
function draw(){
  const ids=pathIds();const onPath=new Set(ids);let w=0,h=0;
  let base='',hot='',dash='',labs='';
  Object.keys(T.nodes).forEach(id=>{const t=T.nodes[id];const p=T.pos[id];const rw=id===T.root?176:PW;w=Math.max(w,p.x+PW+80);h=Math.max(h,p.y+80);
    if(!t.parent)return;const q=T.pos[t.parent];const pw=t.parent===T.root?176:PW;
    const d=elbow(q.x+pw,q.y,p.x,p.y);const hotE=onPath.has(id)&&onPath.has(t.parent);
    if(hotE)hot+=`<path d="${d}" fill="none" stroke="#FA2E43" stroke-width="2.6" stroke-linecap="round"/><circle cx="${p.x}" cy="${p.y}" r="5" fill="#FA2E43" stroke="#fff" stroke-width="2"/>`;
    else base+=`<path d="${d}" fill="none" stroke="#E4E8ED" stroke-width="2.4" stroke-linecap="round"/>`;
    const pr=pred(ND[t.parent],ND[id]);labs+=`<g transform="translate(${p.x-40},${p.y})"><rect x="-17" y="-9" width="34" height="18" rx="9" fill="#fff" stroke="${hotE?'#FA2E43':'#E4E8ED'}"/><text x="0" y="4" text-anchor="middle" font-size="10.5" font-weight="600" fill="${hotE?'#C81E33':'#7b7e86'}" font-family="Pretendard">${pr.label}</text></g>`});
  T.extra.forEach(([a,b])=>{if(a!==T.sel&&b!==T.sel)return;const p=T.pos[a],q=T.pos[b];if(!p||!q)return;const x1=p.x+PW,y1=p.y,x2=q.x,y2=q.y;const left=q.x<p.x;const d=left?`M${p.x},${p.y} C${p.x-60},${p.y} ${q.x+PW+60},${q.y} ${q.x+PW},${q.y}`:elbow(x1,y1,x2,y2);dash+=`<path d="${d}" fill="none" stroke="#C9CED6" stroke-width="1.4" stroke-dasharray="4 5"/>`});
  const W=Math.max(w,stage.clientWidth-2),Hh=Math.max(h,stage.clientHeight-2);
  cvEl.style.width=W+'px';cvEl.style.height=Hh+'px';sv.setAttribute('width',W);sv.setAttribute('height',Hh);
  sv.innerHTML=dash+base+hot+labs;
}
/* ---------- 동작 ---------- */
function click(id){touched=true;
  const t=T.nodes[id];T.sel=id;T.last=id;
  if(id!==T.root){if(t.ex){collapse(id)}else expand(id)}
  sync();
  setTimeout(()=>centerOn(id),60);
}
function reroot(id){reset(id);sync();setTimeout(()=>centerOn(id),80)}
function collapseAll(){T.nodes[T.root].kids.slice().forEach(k=>collapse(k));T.nodes[T.root].ex=false;expand(T.root,true);T.sel=T.root;sync()}
/* ---------- 상단/패널 ---------- */
function updateBar(){
  const ids=pathIds();
  $('#bar').innerHTML='<span class="lb">시작점</span>'+STARTS.map(s=>`<button class="chip ${ND[s[1]]&&T.root===s[1]?'on':''}" onclick="reroot('${s[1]}')">${s[0]} · ${ND[s[1]].name.length>7?ND[s[1]].name.slice(0,6)+'…':ND[s[1]].name}</button>`).join('')+'<span class="sp"></span><span class="cnt"><b>'+Object.keys(T.nodes).length+'</b>펼쳐진 노드</span><button class="chip" onclick="collapseAll()">모두 접기</button><span class="hint">'+T.hint+'</span>';
}
const SAVED=[];
function chainHTML(ids){return ids.map((id,i)=>{const n=ND[id];const rel=i?`<span class="rl">${pred(ND[ids[i-1]],n).label}</span>`:'';return rel+`<span class="cn ${i===ids.length-1?'last':''}"><i style="background:${i===ids.length-1?'#FA2E43':COL[n.d]}"></i>${n.name.length>12?n.name.slice(0,11)+'…':n.name}</span>`}).join('')}
function saveCur(){const ids=pathIds();if(ids.length<2)return;const key=ids.join('>');if(SAVED.some(x=>x.join('>')===key)){toast('이미 담은 경로예요');return}SAVED.push(ids);updateTray();toast('경로를 담았어요')}
function delSaved(i){SAVED.splice(i,1);updateTray()}
function restore(i){const ids=SAVED[i];reset(ids[0]);for(let k=1;k<ids.length;k++){const par=T.nodes[ids[k-1]];if(!par.ex)expand(ids[k-1],true);if(!T.nodes[ids[k]]){T.nodes[ids[k]]={id:ids[k],parent:ids[k-1],depth:par.depth+1,ex:false,kids:[]};par.kids.push(ids[k]);T.pos[ids[k]]={x:null}}}T.sel=ids[ids.length-1];sync()}
function updateTray(){
  const ids=pathIds();
  const head=`<div class="cur"><h6>선택한 경로 <b>${ids.length}단계</b></h6><div class="chain">${chainHTML(ids)}</div></div><button class="bt" ${ids.length<2?'disabled':''} onclick="saveCur()">＋ 경로 담기</button><span class="vl"></span>`;
  const sv=`<div class="sv"><h6>담은 경로 <b>${SAVED.length}개</b></h6>${SAVED.length?`<div class="saved">${SAVED.map((x,i)=>`<div class="sp1" onclick="restore(${i})"><span><b>${x.map(id=>ND[id].name).join(' › ')}</b><small>${x.length}단계 · ${DN[ND[x[x.length-1]].d]}</small></span><em onclick="event.stopPropagation();delSaved(${i})">×</em></div>`).join('')}</div>`:'<div class="none2">노드를 눌러 길을 만든 뒤 「경로 담기」를 누르면 여기에 모여요.</div>'}</div>`;
  $('#tray').innerHTML=head+sv;
}
function updatePanel(){
  const id=T.sel;const n=ND[id];const nb=nbrs(id);const t=T.nodes[id];
  const stats=n.d==='s'?`<div><small>스킬 보유자</small><b>${n.h.toLocaleString()}명</b></div><div><small>전체 평균</small><b>${n.avg} pt</b></div><div><small>연관 콘텐츠</small><b>${nb.c.length}개</b></div><div><small>연관 커리어</small><b>${nb.k.length}개</b></div>`
   :n.d==='c'?`<div><small>유형</small><b>${n.type}</b></div><div><small>분량</small><b>${n.m>=60?Math.floor(n.m/60)+'시간 '+(n.m%60||''):n.m+'분'}</b></div><div><small>연관 스킬</small><b>${nb.s.length}개</b></div><div><small>연관 커리어</small><b>${nb.k.length}개</b></div>`
   :`<div><small>커리어 보유자</small><b>${n.h.toLocaleString()}명</b></div><div><small>연관 스킬</small><b>${nb.s.length}개</b></div><div><small>연관 콘텐츠</small><b>${nb.c.length}개</b></div><div><small>비슷한 커리어</small><b>${nb.k.length}개</b></div>`;
  const lab=n.d==='s'?'스킬 상세 보기':n.d==='c'?(n.type==='과정'?'구매하기':'학습하기'):'커리어 상세 보기';
  const tri=[];if(t.parent){const q=pred(ND[t.parent],n);tri.push([q.from,q.label,q.to,q.dir])}
  t.kids.slice(0,4).forEach(k=>{const q=pred(n,ND[k]);tri.push([q.from,q.label,q.to,q.dir])});
  const path=pathIds().map(i=>ND[i].name);
  $('#panel').innerHTML=`<div class="k">${DN[n.d]}${n.mine?' · 마이커리어':''}${id===T.root?' · 중심':''}</div><h2>${n.name}</h2>
  <div class="st">${stats}</div>
  <div class="btns"><button class="go ${n.d==='c'?'':'d'}" onclick="ask('${lab}')">${lab}</button>${id!==T.root?`<button class="go o" onclick="reroot('${id}')">이 노드를 중심으로</button>`:''}</div>
  <div class="sec"><h5>지나온 길 <span>${path.length}단계</span></h5><div class="tp" style="flex-wrap:wrap;white-space:normal;gap:4px 6px">${path.map((p,i)=>`<b>${p}</b>${i<path.length-1?'<u>›</u>':''}`).join('')}</div></div>
  <div class="sec"><h5>관계 <span>주어 · 관계 · 대상</span></h5>${tri.map(x=>`<div class="tp"><b>${x[0].name}</b><i>${x[1]}</i><u>${x[3]?'→':'—'}</u><b>${x[2].name}</b></div>`).join('')||'<div class="empty">노드를 눌러 펼치면 관계가 보여요.</div>'}</div>
  <p class="empty" style="margin-top:18px">누르면 펼쳐지고, 한 번 더 누르면 접혀요. 더블클릭하면 그 노드가 중심이 돼요.</p>`;
}
let pend=null;
function ask(t){pend=t;$('#dt').textContent=t;$('#dlg').classList.add('on')}
function dlg(ok){$('#dlg').classList.remove('on');if(ok)toast(pend+' 화면으로 이동해요')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
window.addEventListener('resize',()=>draw());

function setFull(on){FULL=on;document.body.classList.toggle('full',on);$('#fxi').innerHTML=on?'<path d="M10 4v6H4M14 20v-6h6M10 10L4 4M14 14l6 6"/>':'<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l-7-7"/>'.replace('M4 20l-7-7','M4 20l7-7');$('#fx').title=on?'축소':'확장';setTimeout(()=>{sync();draw()},30)}
function clampPan(){const cw=cvEl.offsetWidth*ZOOM,ch=cvEl.offsetHeight*ZOOM,m=140,sw=stage.clientWidth,sh=stage.clientHeight;PX=Math.max(-(cw-m),Math.min(sw-m,PX));PY=Math.max(-(ch-m),Math.min(sh-m,PY))}
function applyView(){clampPan();cvEl.style.transform='translate('+PX+'px,'+PY+'px) scale('+ZOOM+')';stage.style.backgroundPosition=PX+'px '+PY+'px';stage.style.backgroundSize=(44*ZOOM)+'px '+(44*ZOOM)+'px'}
let pa=0;function animPan(tx,ty){clearInterval(pa);let n=0;const sx=PX,sy=PY;pa=setInterval(()=>{n++;const t=Math.min(1,n/16),e=1-Math.pow(1-t,3);PX=sx+(tx-sx)*e;PY=sy+(ty-sy)*e;applyView();if(t>=1)clearInterval(pa)},16)}
function ensureVisible(id){const p=T.tgt[id];if(!p)return;const kids=T.nodes[id]&&T.nodes[id].kids.length;const sw=stage.clientWidth,sh=stage.clientHeight;const left=p.x*ZOOM+PX,right=(p.x+PW+(kids?GX:0)+40)*ZOOM+PX,top=(p.y-PH)*ZOOM+PY,bottom=(p.y+PH)*ZOOM+PY;let dx=0,dy=0;if(right>sw-30)dx=sw-30-right;if(left+dx<30)dx=30-left;if(top<80||bottom>sh-80)dy=sh/2-(p.y*ZOOM+PY);animPan(PX+dx,PY+dy)}
function centerOn(id){const p=T.tgt[id];if(!p)return;const w=id===T.root?176:PW;animPan(stage.clientWidth/2-(p.x+w/2)*ZOOM,stage.clientHeight/2-p.y*ZOOM)}
function setZoom(z,cx,cy){const z2=Math.max(.5,Math.min(2,Math.round(z*100)/100));if(cx==null){cx=stage.clientWidth/2;cy=stage.clientHeight/2}PX=cx-(cx-PX)*z2/ZOOM;PY=cy-(cy-PY)*z2/ZOOM;ZOOM=z2;$('#zl').textContent=Math.round(ZOOM*100)+'%';draw();applyView()}
$('#zp').onclick=()=>setZoom(ZOOM+.1);$('#zm').onclick=()=>setZoom(ZOOM-.1);$('#zl').onclick=()=>setZoom(1);$('#zl').style.cursor='pointer';$('#zl').title='원래 크기로';
stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){const r=stage.getBoundingClientRect();setZoom(ZOOM*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top)}else{PX-=e.deltaX;PY-=e.deltaY;applyView()}},{passive:false});
$('#fx').onclick=()=>{if(parent!==window)parent.postMessage({gxfull:!FULL},'*');else setFull(!FULL)};
window.addEventListener('message',e=>{if(e.data&&typeof e.data.gxfull==='boolean')setFull(e.data.gxfull)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&FULL){if(parent!==window)parent.postMessage({gxfull:false},'*');else setFull(false)}});
(function(){let d=null;
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('.pl'))return;d={x:e.clientX,y:e.clientY,l:PX,t:PY};clearInterval(pa);stage.classList.add('g');stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!d)return;PX=d.l+(e.clientX-d.x);PY=d.t+(e.clientY-d.y);applyView()});
  const end=()=>{d=null;stage.classList.remove('g')};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  $('#fc').onclick=()=>centerOn(T.sel||T.root);
})();
reset('plan');sync();applyView();(function(){const p=T.tgt[T.root];PX=stage.clientWidth/2-(p.x+88)*ZOOM;PY=stage.clientHeight/2-p.y*ZOOM;applyView()})();
let touched=false;['pointerdown','wheel'].forEach(t=>stage.addEventListener(t,()=>{touched=true},{passive:true}));
const cNow=()=>{if(touched||!stage.clientHeight)return;const p=T.tgt[T.root];PX=stage.clientWidth/2-(p.x+88)*ZOOM;PY=stage.clientHeight/2-p.y*ZOOM;applyView()};
if(window.ResizeObserver)new ResizeObserver(cNow).observe(stage);setTimeout(cNow,200);setTimeout(cNow,700);
<\/script>

 if(o.step===2)return obShell(2,`${q('어떤 목표로 학습하세요?','가장 가까운 하나를 골라 주세요.')}<div class="ob-list">${OBGOAL.map((g,i)=>`<div class="ob-opt ${o.goal===i?'on':''}" onclick="obGoal(${i})"><div><b>${g[0]}</b><span>${g[1]}</span></div><i class="rad"></i></div>`).join('')}</div>`,`<button class="btn outline lg" onclick="obGo(1)">이전</button><button class="btn primary lg" style="flex:1" onclick="obGo(3)">다음</button>`);
 if(o.step===3)return obShell(3,`${q(o.job+'에게 필요한 스킬을 골라 뒀어요','바꾸거나 더 추가해도 돼요. 최대 3개까지 고를 수 있어요. ('+o.picked.length+'/3)')}<div class="skpick">${OBSK.map(k=>`<div class="skp ${o.picked.includes(k)?'on':''}" onclick="obPick('${k}')">${tile(k,true)}<span style="flex:1">${SK[k].n}</span>${(JOBSK[o.job]||[]).includes(k)?'<span class="tag red">직무 추천</span>':''}</div>`).join('')}</div><div class="inp plain" style="margin-top:16px"><input placeholder="직접 적어도 돼요. 예) 데이터 분석을 배우고 싶어요"><span class="si" onclick="toast('문장에서 서비스 기획 · 데이터 분석을 찾았어요')">${SEARCH}</span></div>`,`<button class="btn outline lg" onclick="obGo(2)">이전</button><button class="btn primary lg" style="flex:1" onclick="obGo(4)" ${o.picked.length?'':'disabled'}>다음</button>`);
 if(o.step===4){const L=obLevel();return obShell(4,`${q('지금 수준을 체크해 볼까요?','해당되는 항목을 눌러 주세요.')}<div class="ob-live"><div class="gauge" style="width:96px;height:52px;margin:0">${gaugeSvg(L.n/6<0.08?0.08:Math.min(1,L.n/6))}</div><div style="flex:1"><div class="s12">예상 시작 레벨</div><div class="h24">Lv.${L.lv} · ${L.label}</div></div><div class="col" style="gap:4px;align-items:flex-end">${tagH('로드맵 약 '+L.weeks+'주')}${tagH('+'+L.pts+' pt','red')}</div></div><div class="ob-list" style="margin-top:12px">${QS.map((qq,i)=>`<div class="ob-opt chk2 ${o.checks[i]?'on':''}" onclick="obCheck(${i})"><i class="cb"></i><div style="flex:1"><b>${qq[0]}</b></div>${tile(qq[2],true)}</div>`).join('')}<div class="ob-opt chk2 ${o.sub.some(Boolean)?'on':''}" style="display:block" onclick="obCheck(5)"><div class="row" style="gap:12px"><i class="cb"></i><b style="flex:1">아래 중 해당되는 항목이 있어요</b></div><div class="ob-sublist" onclick="event.stopPropagation()">${['주 1회 이상 학습 중이에요','업무에 AI 도구를 써요','스킬 관련 자격증이 있어요'].map((t,i)=>`<label class="row" style="gap:8px;cursor:pointer" onclick="obSub(${i})"><i class="cb s ${o.sub[i]?'k':''}"></i>${t}</label>`).join('')}</div></div></div>`,`<button class="btn outline lg" onclick="obGo(3)">이전</button><button class="btn primary lg" style="flex:1" onclick="obGo(5)">로드맵 만들기 ✦</button>`)}

 if(o.step===6){const ST=[['Step 1 · 입문','사용자 문제 정의하기','김도윤 · 영상 12분','svc',20,3],['Step 2 · 기초','서비스 기획서 기초','이정민 · 과정 5강','svc',60,4],['Step 3 · 응용','SQL 없이 시작하는 데이터 분석','김도윤 · 영상 18분','data',30,0],['Step 4 · 실전','데이터로 검증하는 서비스 기획','이정민 · 과정 8강','svc',90,1]];return obShell(6,`<div style="text-align:center;margin-bottom:24px"><span class="tag red">김휴넷님을 위한 스킬 로드맵</span><h2 class="ob-q" style="margin-top:10px">${o.job} 로드맵이 완성됐어요</h2><p class="ob-sub">Lv.2에서 Lv.4를 목표로, 이미 아는 사용자 이해는 건너뛰고 데이터로 검증하는 단계에 집중해 약 6주로 구성했어요.</p></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">${ST.map((s,i)=>`<div class="stepcard"><span class="stepchip ${i===0?'on':''}">${s[0]}</span><div style="margin-top:8px">${th(s[5])}</div><div class="b16" style="margin:8px 0 2px">${s[1]}</div><div class="s12" style="margin-bottom:6px">${s[2]}</div><div class="row" style="gap:6px">${tagH(SK[s[3]].n)}${pt(s[4])}</div>${o.reasonOpen&&i===0?`<div class="reason"><b style="color:var(--ink)">추천 이유</b><p style="margin-top:4px">서비스 기획 Lv.2에서 가장 먼저 필요한 건 문제를 정확히 정의하는 힘이에요.</p></div>`:''}</div>`).join('')}</div>`,`<button class="btn outline lg" onclick="obGo(1)">다시 만들기</button><span class="sp"></span><span class="pt big" style="align-self:center;margin-right:8px">총 +200<small>pt</small></span><button class="btn primary lg" style="min-width:260px" onclick="obStart()">이 로드맵으로 시작하기</button>`,true)}

let GRAF=0,GT=0;

 const nodes=[...el.querySelectorAll('.gnode')],lines=[...el.querySelectorAll('svg.lines line')],rings=[...el.querySelectorAll('.gring')],ctr=el.querySelector('.gcenter');
 nodes.forEach((n,i)=>{n.onmouseenter=()=>{el.classList.add('hov');n.classList.add('hv');if(lines[i])lines[i].classList.add('hl')};n.onmouseleave=()=>{el.classList.remove('hov');n.classList.remove('hv');if(lines[i])lines[i].classList.remove('hl')}});

 let drag=null,moved=0,last=performance.now();
 el.onpointerdown=e=>{if(e.target.closest('.sidepanel,.gctl,.legend'))return;drag={x:e.clientX,y:e.clientY};moved=0;el.setPointerCapture(e.pointerId);el.classList.add('grab')};
 el.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);drag={x:e.clientX,y:e.clientY};c.px+=dx;c.py+=dy};
 el.onpointerup=el.onpointercancel=()=>{drag=null;el.classList.remove('grab')};
 el.addEventListener('click',e=>{if(moved>5){e.stopPropagation();e.preventDefault()}},true);
 el.onwheel=e=>{e.preventDefault();galZoom(e.deltaY<0?.1:-.1)};
 el.ondblclick=()=>galReset();
 function frame(now){if(!document.body.contains(el))return;const dt=Math.min(.05,(now-last)/1000);last=now;GT+=dt;
  const W=el.clientWidth,H=el.clientHeight,cx=W/2+c.px,cy=H/2+c.py,z=c.zoom;
  
  nodes.forEach((n,i)=>{const u=(+n.dataset.x-50)/50,v=(+n.dataset.y-50)/50;
   const ru=u,rv=v;
   const depth=(rv+1.2)/2.4;                            // 0 먼 쪽 ~ 1 가까운 쪽
   const breathe=1+.025*Math.sin(GT*.4*seeds[i].sp+seeds[i].ph);
   const sc=(.95+depth*.15)*z*breathe;
   const x=cx+ru*W*.46*z,y=cy+rv*H*.30*z*(.9+depth*.3);
   n.style.left=x+'px';n.style.top=y+'px';n.style.transform=`translate(-50%,-50%) scale(${sc.toFixed(3)})`;
   n.style.opacity='1';n.style.zIndex=Math.round(depth*100)+(n.classList.contains('sel')?200:0);n.style.filter='none';
   const l=lines[i];if(l){l.setAttribute('x1',cx);l.setAttribute('y1',cy);l.setAttribute('x2',x);l.setAttribute('y2',y);l.style.opacity=''}});
  if(ctr){ctr.style.left=cx+'px';ctr.style.top=cy+'px';ctr.style.transform=`translate(-50%,-50%) scale(${(z*1.05).toFixed(3)})`}
  rings.forEach(r=>{const R=+r.dataset.r/1040;r.style.left=cx+'px';r.style.top=cy+'px';r.style.width=(W*.92*R*z)+'px';r.style.height=(H*.62*R*z)+'px'});
  const st=el.querySelector('.stars');if(st)st.style.backgroundPosition=`${c.px*.15}px ${c.py*.15}px`;
